# Configuration file for MADRL-GA Framework
# Modify these parameters to customize the optimization behavior

[MADRL]
# Multi-Agent Deep Reinforcement Learning parameters
num_agents = 5
learning_rate = 0.001
epsilon_start = 1.0
epsilon_min = 0.01
epsilon_decay = 0.995
replay_buffer_size = 10000
batch_size = 32
target_update_frequency = 100
training_episodes = 500

[GA]
# Genetic Algorithm parameters
population_size = 50
num_generations = 100
crossover_rate = 0.8
mutation_rate = 0.1
elite_size = 5
tournament_size = 3

[NETWORK]
# Network-specific parameters
voltage_limits_min = 0.95
voltage_limits_max = 1.05
base_voltage_33 = 12.66
base_voltage_123 = 4.16
base_power = 100

[OPTIMIZATION]
# Optimization parameters
max_optimization_steps = 10
use_ga_fine_tuning = true
ga_fine_tuning_generations = 50
execution_time_limit = 300

[VISUALIZATION]
# Visualization parameters
figure_size_width = 15
figure_size_height = 10
plot_style = seaborn-v0_8
save_plots = true
plot_dpi = 300

[LOGGING]
# Logging parameters
log_level = INFO
save_training_history = true
save_optimization_results = true
export_csv = true
generate_reports = true
